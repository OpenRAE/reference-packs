name: isolated-python-analysis-sandbox
version: 1.0.0
description: Reusable static infrastructure for Isolated Python analysis sandbox.
module:
  id: infrastructure/isolated-python-analysis-sandbox
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - sandbox
  description: Composable Isolated Python analysis sandbox infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: isolated-python-analysis-sandbox
nodes:
  sandbox:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (Isolated Python
      analysis sandbox).
    source:
      name: python
      version: '3.12'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 8000
      protocol: tcp
      name: control
      description: Declared control service surface.
