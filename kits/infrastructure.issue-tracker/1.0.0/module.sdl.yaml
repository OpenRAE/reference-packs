name: issue-tracker
version: 1.0.0
description: Reusable static infrastructure for Issue tracker.
module:
  id: infrastructure/issue-tracker
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - tracker
  description: Composable Issue tracker infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: issue-tracker
nodes:
  tracker:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (Issue tracker).
    source:
      name: openproject
      version: stable
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 8080
      protocol: tcp
      name: http
      description: Declared http service surface.
