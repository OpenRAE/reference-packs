name: ssh-accessible-linux-host
version: 1.0.0
description: Reusable static infrastructure for SSH-accessible Linux host.
module:
  id: infrastructure/ssh-accessible-linux-host
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - endpoint
  description: Composable SSH-accessible Linux host infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: ssh-accessible-linux-host
nodes:
  endpoint:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (SSH-accessible
      Linux host).
    source:
      name: linux
      version: stable
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 22
      protocol: tcp
      name: ssh
      description: Declared ssh service surface.
