name: rdp-accessible-windows-host
version: 1.0.0
description: Reusable static infrastructure for RDP-accessible Windows host.
module:
  id: infrastructure/rdp-accessible-windows-host
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - endpoint
  description: Composable RDP-accessible Windows host infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: rdp-accessible-windows-host
nodes:
  endpoint:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (RDP-accessible
      Windows host).
    source:
      name: windows-server
      version: '2022'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 3389
      protocol: tcp
      name: rdp
      description: Declared rdp service surface.
