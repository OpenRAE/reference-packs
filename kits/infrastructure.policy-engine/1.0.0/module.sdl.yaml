name: policy-engine
version: 1.0.0
description: Reusable static infrastructure for Policy engine.
module:
  id: infrastructure/policy-engine
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - policy
  description: Composable Policy engine infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: policy-engine
nodes:
  policy:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (Policy engine).
    source:
      name: open-policy-agent
      version: '1'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 8181
      protocol: tcp
      name: http
      description: Declared http service surface.
