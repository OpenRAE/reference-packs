name: reverse-proxy-api-gateway
version: 1.0.0
description: Reusable static infrastructure for Reverse proxy/API gateway.
module:
  id: infrastructure/reverse-proxy-api-gateway
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - gateway
  description: Composable Reverse proxy/API gateway infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: reverse-proxy-api-gateway
nodes:
  gateway:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (Reverse proxy/API
      gateway).
    source:
      name: traefik
      version: '3'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 80
      protocol: tcp
      name: http
      description: Declared http service surface.
    - port: 443
      protocol: tcp
      name: https
      description: Declared https service surface.
