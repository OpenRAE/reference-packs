name: load-rehearsal-runner
version: 1.0.0
description: Reusable static infrastructure for Load/rehearsal runner.
module:
  id: infrastructure/load-rehearsal-runner
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - runner
  description: Composable Load/rehearsal runner infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: load-rehearsal-runner
nodes:
  runner:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (Load/rehearsal
      runner).
    source:
      name: k6
      version: stable
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 6565
      protocol: tcp
      name: api
      description: Declared api service surface.
