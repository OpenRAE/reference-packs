name: workflow-orchestrator
version: 1.0.0
description: Reusable static infrastructure for Workflow orchestrator.
module:
  id: infrastructure/workflow-orchestrator
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - orchestrator
  description: Composable Workflow orchestrator infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: workflow-orchestrator
nodes:
  orchestrator:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (Workflow orchestrator).
    source:
      name: airflow
      version: '3'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 8080
      protocol: tcp
      name: http
      description: Declared http service surface.
