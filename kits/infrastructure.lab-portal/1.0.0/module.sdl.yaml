name: lab-portal
version: 1.0.0
description: Reusable static infrastructure for Lab portal.
module:
  id: infrastructure/lab-portal
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - portal
  description: Composable Lab portal infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: lab-portal
nodes:
  portal:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (Lab portal).
    source:
      name: homepage
      version: stable
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 3000
      protocol: tcp
      name: http
      description: Declared http service surface.
