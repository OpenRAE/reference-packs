name: webmail-service
version: 1.0.0
description: Reusable static infrastructure for Webmail service.
module:
  id: infrastructure/webmail-service
  version: 1.0.0
  parameters:
  - deployment_profile
  - service_label
  exports:
    nodes:
    - webmail
  description: Composable Webmail service infrastructure module.
variables:
  deployment_profile:
    type: string
    default: standard
    allowed_values:
    - compact
    - standard
  service_label:
    type: string
    default: webmail-service
nodes:
  webmail:
    type: vm
    description: ${deployment_profile} profile for ${service_label} (Webmail service).
    source:
      name: roundcube
      version: '1'
    resources:
      cpu: 2
      ram: 2 GiB
    services:
    - port: 8080
      protocol: tcp
      name: http
      description: Declared http service surface.
